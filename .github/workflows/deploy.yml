# Tests the security rules on every change.
#  • Pull requests: if the tests pass, a private preview copy of the portal is published and
#    its link is posted on the pull request.
#  • Merges to main: if the tests pass, the portal, database rules and storage rules go live.
# Needs repository secrets: FIREBASE_SERVICE_ACCOUNT (docs/SETUP.md, step 5) and
# C2_CLIENT_SECRET (Concept2 Logbook API, docs/CONCEPT2.md); optional SMTP_HOST, SMTP_PORT, SMTP_USER,
# SMTP_PASS, MAIL_FROM for member emails (docs/EMAIL.md).
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PROJECT_ID: vrc-rower-s-portal

jobs:
  test:
    name: Security rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm test

  preview:
    name: Preview link
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, checks: write }
    steps:
      - uses: actions/checkout@v4
      - name: Stamp preview version
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          node -e 'require("fs").writeFileSync("public/version.json", JSON.stringify({version:"preview #${{ github.event.pull_request.number }}",sha:process.env.GITHUB_SHA.slice(0,7),date:new Date().toISOString(),title:process.env.TITLE}))'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT_ID }}
          expires: 7d

  deploy:
    name: Deploy to live
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }   # to tag each live version as a GitHub release
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version (v1.<run number>) into the portal
        id: ver
        env: { MSG: "${{ github.event.head_commit.message }}" }
        run: |
          V="v1.${{ github.run_number }}"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          node -e 'const t=(process.env.MSG||"").split("\n").filter(Boolean);const title=(t[0]||"").startsWith("Merge pull request")&&t[1]?t[1]:(t[0]||"");require("fs").writeFileSync("public/version.json", JSON.stringify({version:process.argv[1],sha:process.env.GITHUB_SHA.slice(0,7),date:new Date().toISOString(),title}))' "$V"
          cat public/version.json
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Install server function packages
        run: npm install --prefix functions --no-audit --no-fund
      - name: Write server function settings (Concept2 + email)
        env:
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          node -e '
            const keys = ["C2_CLIENT_SECRET","SMTP_HOST","SMTP_PORT","SMTP_USER","SMTP_PASS","MAIL_FROM"];
            const lines = ["C2_CLIENT_ID=CyxYSBWvx6QavQRqq1WonK0BvEkWV9s2qjZ91rNN"];
            for (const k of keys) if (process.env[k]) lines.push(k + "=" + JSON.stringify(process.env[k]));
            require("fs").writeFileSync("functions/.env", lines.join("\n") + "\n");
            console.log("Settings written:", lines.map(l => l.split("=")[0]).join(", "));'
      - name: Deploy portal + rules + server function
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules,storage,functions --project "$PROJECT_ID" --non-interactive --force
      - name: Record this live version as a GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          T=$(node -p 'require("./public/version.json").title || "Update"')
          gh release create "${{ steps.ver.outputs.v }}" --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.v }} – $T" --generate-notes --latest || echo "Release not created (non-fatal)"
