<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRC Rowing Portal</title>
<link rel="icon" href="img/vrc-logo.png">
<script type="module" src="js/firebase-adapter.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231f20; --ink2:#4a4647; --ink3:#86888b; --line:#dfe3e2; --paper:#f7f6f3; --card:#ffffff;
  --navy:#231f20; --water:#231f20; --water-l:#ececed; --red:#ea3c42; --red-d:#c92c32; --red-l:#fdeaea; --grey:#a7a9ac;
  --ok:#2c7a57; --ok-l:#e2f2ea; --bad:#b83a2e; --bad-l:#f8e5e2; --warn:#a86b12; --warn-l:#f8eedb; --off:#6b7680; --off-l:#eceeef;
  --r:6px; --shadow:0 1px 2px rgba(16,34,47,.06),0 4px 14px rgba(16,34,47,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
a{color:var(--water)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* header */
header{background:#fff;color:var(--ink);position:sticky;top:0;z-index:20;border-bottom:4px solid var(--red);box-shadow:0 1px 0 rgba(0,0,0,.04)}
header .wrap{display:flex;align-items:center;gap:20px;height:70px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:20px;color:var(--ink)}
.brand h1 b{color:var(--red)}
.brand small{color:var(--ink3);font-size:12px;display:block;font-family:Inter;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:12px}
nav a{color:var(--ink2);text-decoration:none;padding:8px 12px;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent}
nav a:hover{color:var(--red-d)}
nav a.on{color:var(--red-d);border-bottom-color:var(--red)}
nav a .n{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
.mods{margin-left:auto;display:flex;gap:6px;align-items:center}
.mod-soon{font-size:11.5px;color:var(--ink3);border:1px dashed #c9ced6;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:7px}
.role{font-size:12px;background:var(--water-l);color:var(--ink2);padding:5px 10px;border-radius:20px;white-space:nowrap}
.role b{color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 18px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
.stat:hover{border-color:var(--line)}
.stat.sel{border-color:var(--red)}
.stat .v{font-family:'Libre Baskerville',Georgia,serif;font-size:28px;font-weight:650;line-height:1.1}
.stat .l{color:var(--ink2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.chips{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.chip{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500}
.chip.on{background:var(--navy);color:#fff}
select.f{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c3cacb}
.btn.pri{background:var(--red-d);border-color:var(--red-d);color:#fff;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;font-weight:700}
.btn.pri:hover{background:#a8232a}
.btn.dan{color:var(--bad);border-color:#ecc6c1}
.btn.dan.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label.tog{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;cursor:pointer;user-select:none}

/* grid */
.group{margin-bottom:26px}
.group h2{font-size:18px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px;padding-left:12px;border-left:4px solid var(--red)}
.group h2 span{font-family:Inter;font-size:12px;color:var(--ink3);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.boat{background:var(--card);border-radius:var(--r);border-top:3px solid var(--navy)!important;box-shadow:var(--shadow);padding:14px 15px 12px;cursor:pointer;border:1px solid transparent;position:relative;transition:border-color .15s,transform .15s}
.boat:hover{border-color:#cdd5d6;border-top-color:var(--red)!important;transform:translateY(-1px)}
.boat .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.boat h3{font-size:16.5px;line-height:1.2}
.boat .meta{color:var(--ink2);font-size:12.5px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.boat .foot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.boat.retired{opacity:.62}
.boat .flag{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;font-weight:600;padding:1px 7px}
.rig{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--off-l);color:var(--ink2);letter-spacing:.02em}
.rig.cur{background:var(--navy);color:#fff}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.s-available{background:var(--ok-l);color:var(--ok)}
.s-dnr{background:var(--bad-l);color:var(--bad)}
.s-repair{background:var(--warn-l);color:var(--warn)}
.s-retired{background:var(--off-l);color:var(--off)}
.tag{font-size:11.5px;color:var(--ink3)}
.warnline{font-size:12px;color:var(--bad);font-weight:500}

/* table */
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.t th{text-align:left;font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;background:#fbfaf8}
.t td{padding:9px 12px;border-bottom:1px solid #eef0ef;vertical-align:middle}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#f9fbfb}
.t td.name{font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,24,34,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.dh{padding:20px 22px 16px;background:#fff;border-bottom:4px solid var(--red)}
.dh .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink3);line-height:1}
.dh h2{font-size:24px}
.db{padding:18px 22px 40px;overflow:auto;flex:1}
.sec{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{border-top:1px solid #eef0ef;padding:10px 0;font-size:13.5px}
.item:first-of-type{border-top:0;padding-top:2px}
.item .when{font-size:12px;color:var(--ink3)}
.sev{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.sev-cosmetic{background:var(--off-l);color:var(--off)}
.sev-attention{background:var(--warn-l);color:var(--warn)}
.sev-unsafe{background:var(--bad-l);color:var(--bad)}
.muted{color:var(--ink3)}
.empty{color:var(--ink3);font-size:13px;padding:4px 0}
.callout{background:var(--warn-l);color:#6e4a0f;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.callout.bad{background:var(--bad-l);color:#7c241b}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,24,34,.45);padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h3{font-size:20px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fg .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld textarea{min-height:72px;resize:vertical}
.fld input[type=checkbox]{width:auto}
.fld .hint{font-size:11.5px;color:var(--ink3);margin-top:3px}
.rigpick{display:flex;flex-wrap:wrap;gap:6px}
.rigpick label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink)}
.rigpick input{width:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:var(--bad);font-size:13px;margin-top:10px}

/* list pages */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin:26px 0 14px;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:24px}
.page-h h2::after{content:'';display:block;width:44px;height:3px;background:var(--red);margin-top:8px}
.page-h p{margin:4px 0 0;color:var(--ink2)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);border-left:4px solid var(--red);color:#fff;padding:10px 18px;border-radius:10px;z-index:80;transition:transform .25s;font-weight:500}
.toast.on{transform:translateX(-50%)}
.banner{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--ink2);margin:30px 0}
.banner h3{color:var(--ink);margin-bottom:6px}
footer{color:#cfcfd0;font-size:12px;padding:26px 20px 30px;text-align:center;background:var(--navy);border-top:4px solid var(--red);margin-top:30px}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .mod-soon{display:none}
  nav{margin-left:0}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand h1{display:none}
  nav a{padding:6px 7px;font-size:11.5px;letter-spacing:.04em}
  .brand img{width:44px;height:44px}
  .brand small{display:none}
  header .wrap{gap:8px;padding:0 12px}
  nav a{padding:6px 8px}
  .role{display:none}
  .fg{grid-template-columns:1fr}
  .t .hide-s{display:none}
}

/* members */
.av{border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;letter-spacing:.02em;font-family:Inter,sans-serif}
.mcard .top{align-items:center;gap:12px}
.mcard h3{font-size:15.5px}
.lk{color:var(--ok);font-weight:700}
.stat.nf{cursor:default}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tile{background:#fff;border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.tile .v{font-family:'Libre Baskerville',Georgia,serif;font-size:21px;font-weight:700;line-height:1.2}
.tile .v.sm{font-size:13.5px;padding-top:5px}
.tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;margin-top:2px}
.lock{font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink3);font-weight:500;margin-left:6px}
.lnk{color:var(--red-d);cursor:pointer;font-weight:600}
.lnk:hover{text-decoration:underline}
.bchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:0 6px 6px 0;cursor:pointer;font-size:12.5px;background:#fff;white-space:nowrap}
.bchip:hover{border-color:var(--red)}
.bchip b{color:var(--red-d)}
.claim,.act{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sec.claims{border-left:4px solid var(--red);margin-bottom:18px}
.fsub{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mepage{max-width:760px}
.melink{color:var(--ink);text-decoration:none;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
.melink:hover,.melink.on{border-color:var(--red);color:var(--red-d)}
@media (max-width:560px){
  header nav{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  header nav::-webkit-scrollbar{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .melink{padding:5px 8px;font-size:10.5px}
}

/* programs */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;border-bottom:2px solid var(--line);padding-bottom:6px}
.day h4 span{font-family:'Libre Baskerville',Georgia,serif;font-size:15px;color:var(--ink);letter-spacing:0;margin-left:4px}
.day.today h4{border-bottom-color:var(--red)}.day.today h4 span{color:var(--red-d)}
.day .none{color:#c4c6c9;font-size:13px;padding:4px 2px}
.sc{background:#fff;border-radius:6px;box-shadow:var(--shadow);padding:9px 10px;border-left:4px solid var(--pc);cursor:pointer;margin-bottom:8px;transition:transform .12s}
.sc:hover{transform:translateY(-1px)}
.sc-t{font-size:11.5px;font-weight:700;color:var(--ink2)}.sc-n{font-weight:600;font-size:13.5px;margin:2px 0;line-height:1.25}.sc-m{font-size:11.5px;color:var(--ink3)}
.sc-f{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
.sc.cx .sc-n{text-decoration:line-through}.sc.past{opacity:.55}
.cap{flex:1;min-width:30px;height:5px;background:#ececed;border-radius:3px;overflow:hidden}.cap i{display:block;height:100%;background:var(--pc)}
.pill.pv{background:#ece8f6;color:#5b4b96}
.mybk{margin-bottom:16px}.mybk-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.mb{flex:none;min-width:170px;border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px}
.mb:hover{border-color:var(--pc)}
.shead{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;margin:22px 0 14px;border-top:5px solid var(--pc)}
.sh-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-top:8px}
.shead h2{font-size:24px;margin:2px 0 4px}.shead p{margin:0;color:var(--ink2)}
.sh-cap{text-align:center;min-width:70px}.sh-cap b{font-family:'Libre Baskerville',Georgia,serif;font-size:28px}.sh-cap span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.t.sheet td{vertical-align:top}.t.sheet td.num{color:var(--ink3);font-weight:700;width:30px}.t.sheet tr.me td{background:#fdf6f6}
.t td.ra{text-align:right;white-space:nowrap}.t td.ra .btn{margin-left:4px}
.oseat{color:#5b4b96;font-style:italic}
.rerig{display:inline-block;background:var(--warn-l);color:var(--warn);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:4px;white-space:nowrap}
.avail{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.av-g{margin-bottom:10px}.av-g>.tag{text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:10.5px;margin-bottom:3px}
.avb{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:5px;font-size:13px}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:#fff}
.avb[data-bookboat]{cursor:pointer}.avb[data-bookboat]:hover{background:var(--red-l)}
.seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
tr.inact td{opacity:.55}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}.sgrid{grid-template-columns:1fr}.avail{position:static;max-height:none}}
@media (max-width:560px){.week{grid-template-columns:1fr}.seatgrid{grid-template-columns:1fr}.sh-row{flex-direction:column}}
.calbtns{display:flex;gap:8px;flex-wrap:wrap}
.calcard{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;display:grid;gap:3px}
.mybk h4{display:flex;justify-content:space-between;align-items:center}
.mb .calmini{float:right;border:0;background:none;cursor:pointer;font-size:14px;padding:0 0 0 6px;opacity:.7}
.mb .calmini:hover{opacity:1}

.phrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phlist{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:18px;padding:0;font-size:14px}
.phadd{cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;background:#eee}
.thumbs img.broken{display:none}
.photo-n{font-size:11.5px;color:var(--ink3);margin-left:6px;white-space:nowrap}
#lb{position:fixed;inset:0;background:rgba(10,10,10,.85);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lb button{position:absolute;top:14px;right:18px;font-size:30px;color:#fff;background:none;border:0;cursor:pointer}
.av{position:relative;overflow:hidden}
.avph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rig.adm{background:var(--red-l);color:var(--red-d)}
.sec.admins{margin-bottom:18px;border-left:4px solid var(--navy)}
.sec.admins h4{display:flex;justify-content:space-between;align-items:center}
ol.steps{margin:4px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5}
ol.steps li{margin-bottom:8px}
body.guest header nav,body.guest .mods .role{display:none}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <img src="img/vrc-logo.png" alt="Vancouver Rowing Club" width="56" height="56" style="display:block">
      <div><h1><b>VRC</b> Rowing</h1><small>Club portal</small></div>
    </div>
    <nav>
      <a href="#programs" data-v="programs">Programs</a>
      <a href="#fleet" data-v="fleet">Fleet</a>
      <a href="#members" data-v="members">Members</a>
      <a href="#issues" data-v="issues">Issues<span class="n" id="navIssues" hidden></span></a>
      <a href="#maintenance" data-v="maintenance">Maintenance</a>
    </nav>
    <div class="mods">
      <span class="role" id="role">Connecting…</span>
      <a href="#me" data-v="me" class="melink">My profile</a>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>
<footer>Vancouver Rowing Club · Club portal</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ---------- constants ---------- */
const RIGS=['1x','2x','2-','2+','4x','4x+','4-','4+','8+','8x+'];
const STATUS={available:'Available',dnr:'Do Not Row',repair:'Long-Term Repair',retired:'Retired'};
const STATUS_COLOR={available:'var(--ok)',dnr:'var(--bad)',repair:'var(--warn)',retired:'var(--off)'};
const SEV={cosmetic:'Cosmetic',attention:'Needs attention',unsafe:'Unsafe – do not row'};
const PROGRAMS=['Juniors','Novice','Rec','Sat Masters','Sun Masters','Intermediate','Para','Other'];
const CLASSES=[{k:1,t:'Singles'},{k:2,t:'Doubles & Pairs'},{k:4,t:'Quads & Fours'},{k:8,t:'Eights'}];
const MAINT_DUE_DAYS=180;

/* ---------- state ---------- */
const S={admins:{},settings:{},acct:{},boats:{},issues:{},maint:{},events:{},loaded:{boats:false,issues:false,maint:false,events:false},
  view:'fleet',q:'',cls:'all',status:'active',prog:'all',layout:'grid',open:null,
  db:null,user:null,me:null,isAdmin:false,canWrite:null,readOnly:false,profiles:{},error:null,slow:false};

/* ---------- helpers ---------- */
const blobUrl=x=>/^https?:/.test(x||'')?x:'/_blob/'+x;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowIso=()=>new Date().toISOString();
function fmtDate(d){if(!d)return'—';const x=new Date(d.length===10?d+'T12:00:00':d);if(isNaN(x))return esc(d);return x.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function daysSince(d){if(!d)return Infinity;return Math.floor((Date.now()-new Date(d+'T12:00:00'))/864e5)}
function wtText(w){if(!w||(!w.lbsMax&&!w.kgMax))return'—';const lb=w.lbsMin?`${w.lbsMin}–${w.lbsMax}`:`≤ ${w.lbsMax}`;const kg=w.kgMin?`${w.kgMin}–${w.kgMax}`:`${w.kgMax}`;return `${lb} lb · ${kg} kg`}
function reporter(i){return i.byMember?mName(i.byMember):name(i.by)}
function name(id){if(!id)return'Someone';for(const m of Object.values(S.members||{}))if(m.linkedUser===id)return m.displayName;const p=S.profiles[id];return (p&&p.name)||'Member'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function boatOpenIssues(id){return Object.entries(S.issues).filter(([,i])=>i.boatId===id&&i.status!=='resolved')}
function lastMaint(id){let best=null;for(const m of Object.values(S.maint)){if(m.boatId===id&&m.completed&&m.date&&(!best||m.date>best.date))best=m}return best}
function rigChips(b){return (b.rigs||[]).map(r=>`<span class="rig ${r===b.currentRig?'cur':''}" title="${r===b.currentRig?'Current rig':'Can be rigged as'}">${esc(r)}</span>`).join('')}
function pill(st){return `<span class="pill s-${esc(st)}">${esc(STATUS[st]||st)}</span>`}

/* ---------- data ---------- */
let profileReq=null;
async function resolveProfiles(){
  if(!S.user||!S.user.profiles)return;
  const ids=new Set();
  for(const c of [S.issues,S.maint,S.events])for(const v of Object.values(c)){for(const k of ['by','resolvedBy'])if(v[k])ids.add(v[k])}
  Object.keys(S.claims||{}).forEach(i=>ids.add(i));Object.values(S.members||{}).forEach(m=>{if(m.linkedUser)ids.add(m.linkedUser)});
  const need=[...ids].filter(i=>!(i in S.profiles));
  if(!need.length)return;
  try{const ps=await S.user.profiles(need);for(const id of need)S.profiles[id]=ps&&ps[id]||{};render()}catch(e){}
}
function subDoc(path,key,onData){S.db.doc(path).onSnapshot(snap=>{S[key]=snap.exists?{[snap.id]:snap.data()}:{};if(onData)onData(snap);render()},()=>{})}
function sub(col,key,optional){
  S.db.collection(col).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[key]=o;
    if(!snap.metadata.fromCache&&!optional)S.loaded[key]=true;
    if(Object.values(S.loaded).every(Boolean)){clearTimeout(S._slowT);S.slow=false}
    render();clearTimeout(profileReq);profileReq=setTimeout(resolveProfiles,300);
  },err=>{if(!optional||err.code==='revoked')S.error=err.code;if(!optional)S.loaded[key]=true;render()});
}
async function init(){
  render();
  try{S.db=await claude.use('db')}catch(e){S.db=null}
  try{S.user=await claude.use('user')}catch(e){S.user=null}
  if(S.user){
    try{S.isAdmin=!!(await S.user.canEdit())}catch(e){}
    try{S.canWrite=await S.user.can('data.write')}catch(e){S.canWrite=null}
    try{S.me=await S.user.id()}catch(e){}
  }
  if(!S.db){S.error='nodb';render();return}
  S.guest=!S.isAdmin&&S.canWrite===false;
  if(S.guest){ // signed in but not yet linked to a member: only the profile-request screen
    document.body.classList.add('guest');
    for(const k in S.loaded)S.loaded[k]=true;
    sub('members','members');subDoc('claims/'+S.me,'claims');
    subDoc('accounts/'+S.me,'acct',snap=>{if(snap.exists)location.reload()});
    route();return}
  assetsNs().then(()=>render());
  S._slowT=setTimeout(()=>{S.slow=true;render()},10000);
  sub('boats','boats');sub('issues','issues');sub('maintenance','maint');sub('events','events');
  sub('members','members');sub('activity','activity');sub('crews','crews');
  sub('programs','programs');sub('sessions','sessions');sub('bookings','bookings');sub('occurrences','occ',true);
  sub('memberPrefs','mprefs',true);sub('admins','admins',true);subDoc('config/settings','settings');
  if(S.isAdmin){sub('memberPrivate','mpriv',true);sub('claims','claims',true)}
  else if(S.me){subDoc('memberPrivate/'+S.me,'mpriv')}
  render();
}
const canMember=()=>!!S.db&&!S.readOnly&&S.canWrite!==false;
const canAdmin=()=>!!S.db&&S.isAdmin;

async function guarded(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==='invalid_argument'&&!S.isAdmin){S.readOnly=true;render();toast('You have view-only access')}
    else if(e&&e.code==='photo')toast(e.message);
    else if(e&&e.code==='quota_exceeded')toast('Storage is full – ask an admin to tidy old records');
    else toast('Could not save – please try again');
    return false;
  }
}
function logEvent(boatId,kind,text){return S.db.collection('events').add({boatId,kind,text,by:S.me||null,at:nowIso()})}

/* ---------- routing ---------- */
function route(){const h=S.guest?'me':location.hash.replace('#','');const m=h.match(/^s-([a-z0-9-]+)-(\d{8})$/);
  if(m){S.view='programs';S.sess={id:m[1],date:m[2].slice(0,4)+'-'+m[2].slice(4,6)+'-'+m[2].slice(6)}}
  else{S.sess=null;S.view=['fleet','issues','maintenance','members','me','manage','import'].includes(h)?h:'programs'}
  if(typeof closeModal==='function')closeModal();render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('nav a,a.melink').forEach(a=>a.classList.toggle('on',a.dataset.v===(S.view==='manage'?'programs':S.view)));
  const role=$('#role');
  if(!S.db&&S.error!=='nodb')role.textContent='Connecting…';
  else role.innerHTML=S.isAdmin?'<b>Admin</b> · full access':(canMember()?'<b>Member</b>':'<b>Welcome</b> · link your profile');
  const openIss=Object.values(S.issues).filter(i=>i.status!=='resolved').length;
  const ni=$('#navIssues');ni.hidden=!openIss;ni.textContent=openIss;
  const m=$('#main');
  if(S.error==='nodb'){m.innerHTML=`<div class="banner"><h3>Club data isn't available</h3>Please sign in again to see the fleet and members.</div>`;return}
  if(S.error==='revoked'){m.innerHTML=`<div class="banner"><h3>Access has changed</h3>This page can no longer load fleet data.</div>`;return}
  const loading=!S.loaded.boats&&!Object.keys(S.boats).length;
  if(loading){m.innerHTML=`<div class="banner">${S.slow?'The fleet data can’t be reached yet. It will appear here once the connection recovers.':'Loading the fleet…'}</div>`;return}
  const stale=S.slow?`<div class="callout">Connection is slow – what you see may be out of date.</div>`:'';
  syncMyAdmin();
  m.innerHTML=adminNotice()+stale+(S.view==='issues'?viewIssues():S.view==='maintenance'?viewMaint():S.view==='members'?viewMembers():S.view==='me'?viewMe():S.view==='programs'?viewPrograms():S.view==='manage'?viewManage():S.view==='import'?viewImport():viewFleet());
  if(S.view==='members'||S.view==='me')bindMembers();else if(S.view==='programs')bindPrograms();else if(S.view==='manage')bindManage();else if(S.view==='import')bindImport();else bindMain();
  if(S.open)renderDrawer();else if(S.openM)renderMemberDrawer();
}

function filteredBoats(){
  const q=S.q.trim().toLowerCase();
  return Object.entries(S.boats).filter(([id,b])=>{
    if(S.status==='active'&&b.status==='retired')return false;
    if(!['all','active'].includes(S.status)&&b.status!==S.status)return false;
    if(S.status==='flagged'&&!boatOpenIssues(id).length)return false;
    if(S.cls!=='all'&&String(b.seats)!==S.cls)return false;
    if(S.prog!=='all'&&b.maintenanceProgram!==S.prog)return false;
    if(q&&!(`${b.name} ${(b.rigs||[]).join(' ')} ${b.manufacturer||''} ${b.maintenanceProgram||''}`.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>(a[1].seats-b[1].seats)||((a[1].weight?.kgMax||0)-(b[1].weight?.kgMax||0))||a[1].name.localeCompare(b[1].name));
}

function viewFleet(){
  const all=Object.entries(S.boats);
  const cnt=s=>all.filter(([,b])=>b.status===s).length;
  const flagged=all.filter(([id,b])=>b.status!=='retired'&&boatOpenIssues(id).length).length;
  const active=all.length-cnt('retired');
  const stats=[['active','In fleet',active,'var(--navy)'],['available','Available',cnt('available'),STATUS_COLOR.available],['dnr','Do Not Row',cnt('dnr'),STATUS_COLOR.dnr],['repair','Long-term repair',cnt('repair'),STATUS_COLOR.repair],['flagged','Open issues',flagged,'#8d3fa8']];
  const progs=[...new Set(all.map(([,b])=>b.maintenanceProgram).filter(Boolean))].sort();
  const list=filteredBoats();
  let body='';
  if(!all.length){body=`<div class="banner"><h3>No boats in the register yet</h3>${canAdmin()?'Add the first boat with the button above.':'An admin needs to add the fleet.'}</div>`}
  else if(!list.length){body=`<div class="banner">No boats match these filters.</div>`}
  else if(S.layout==='list'){
    body=`<table class="t"><thead><tr><th>Boat</th><th>Rig</th><th class="hide-s">Max weight</th><th>Status</th><th class="hide-s">Maintained by</th><th class="hide-s">Last maintenance</th><th class="hide-s">Issues</th></tr></thead><tbody>`+
    list.map(([id,b])=>{const lm=lastMaint(id);const oi=boatOpenIssues(id).length;return `<tr class="row" data-boat="${esc(id)}"><td class="name">${esc(b.name)}${b.ownership==='private'?' <span class="tag">private</span>':''}</td><td>${rigChips(b)}</td><td class="hide-s">${wtText(b.weight)}</td><td>${pill(b.status)}</td><td class="hide-s">${esc(b.maintenanceProgram||'—')}</td><td class="hide-s">${lm?fmtDate(lm.date):'<span class="muted">none logged</span>'}</td><td class="hide-s">${oi?`<span class="warnline">${oi} open</span>`:''}</td></tr>`}).join('')+`</tbody></table>`;
  } else {
    body=CLASSES.map(c=>{const g=list.filter(([,b])=>b.seats===c.k);if(!g.length)return'';
      return `<section class="group"><h2>${c.t}<span>${g.length}</span></h2><div class="grid">${g.map(([id,b])=>card(id,b)).join('')}</div></section>`}).join('');
  }
  return `
  <div class="stats">${stats.map(([k,l,v,c])=>`<div class="stat ${S.status===k?'sel':''}" data-stat="${k}"><div class="v">${v}</div><div class="l"><span class="dot" style="background:${c}"></span>${l}</div></div>`).join('')}</div>
  <div class="toolbar">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search boats, rigs, programs…" value="${esc(S.q)}"></div>
    <div class="chips">${[['all','All'],['1','1x'],['2','2s'],['4','4s'],['8','8s']].map(([k,l])=>`<button class="chip ${S.cls===k?'on':''}" data-cls="${k}">${l}</button>`).join('')}</div>
    <select class="f" id="fStatus">${[['active','All active boats'],['available','Available'],['dnr','Do Not Row'],['repair','Long-term repair'],['flagged','With open issues'],['retired','Retired'],['all','Everything incl. retired']].map(([k,l])=>`<option value="${k}" ${S.status===k?'selected':''}>${l}</option>`).join('')}</select>
    <select class="f" id="fProg"><option value="all">Any program</option>${progs.map(p=>`<option ${S.prog===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <div class="chips">${[['grid','Cards'],['list','List']].map(([k,l])=>`<button class="chip ${S.layout===k?'on':''}" data-layout="${k}">${l}</button>`).join('')}</div>
    ${canAdmin()?`<button class="btn pri" id="addBoat">+ Add boat</button>`:''}
  </div>
  ${body}`;
}
function card(id,b){
  const oi=boatOpenIssues(id);const unsafe=oi.some(([,i])=>i.severity==='unsafe');
  const lm=lastMaint(id);
  return `<div class="boat ${b.status==='retired'?'retired':''}" data-boat="${esc(id)}">
    ${oi.length?`<span class="flag" title="Open issues">${oi.length}</span>`:''}
    <div class="top"><h3>${esc(b.name)}</h3>${pill(b.status)}</div>
    <div class="meta"><span>${b.weight&&b.weight.lbsMax?wtText(b.weight):'<span class="muted">No weight class set</span>'}</span>${b.ownership==='private'?'<span>Private</span>':''}</div>
    ${unsafe&&b.status==='available'?`<div class="warnline" style="margin-top:6px">⚠ Reported unsafe – awaiting admin review</div>`:''}
    <div class="foot">${rigChips(b)}<span class="tag" style="margin-left:auto">${lm?'Maint. '+fmtDate(lm.date):''}</span></div>
  </div>`;
}

function viewIssues(){
  const rows=Object.entries(S.issues).sort((a,b)=>{const o=x=>x[1].status==='resolved'?1:0;return o(a)-o(b)||String(b[1].at).localeCompare(String(a[1].at))});
  const open=rows.filter(([,i])=>i.status!=='resolved');const done=rows.filter(([,i])=>i.status==='resolved').slice(0,40);
  const tr=([id,i])=>{const b=S.boats[i.boatId];return `<tr class="row" data-boat="${esc(i.boatId)}"><td class="name">${esc(b?b.name:'(removed boat)')}</td><td><span class="sev sev-${esc(i.severity)}">${esc(SEV[i.severity]||i.severity)}</span></td><td>${esc(i.description)}${(i.photos||[]).length?`<span class="photo-n">📷 ${i.photos.length}</span>`:''}${photoStrip(i.photos)}${i.status==='resolved'&&i.resolution?`<div class="muted" style="font-size:12px">Fix: ${esc(i.resolution)}</div>`:''}</td><td class="hide-s">${esc(reporter(i))}<div class="muted" style="font-size:12px">${fmtDate(i.at)}</div></td><td>${i.status==='resolved'?`<span class="pill s-available">Resolved</span>`:'<span class="pill s-dnr">Open</span>'}</td></tr>`};
  return `<div class="page-h"><div><h2>Damage & issues</h2><p>Reports from members. Admins review, set boat status, and resolve.</p></div>${canMember()?`<button class="btn pri" id="reportAny">Report damage</button>`:''}</div>
  ${open.length?`<table class="t"><thead><tr><th>Boat</th><th>Severity</th><th>Issue</th><th class="hide-s">Reported</th><th>Status</th></tr></thead><tbody>${open.map(tr).join('')}</tbody></table>`:`<div class="banner">No open issues. Nice work, everyone.</div>`}
  ${done.length?`<h3 style="margin:26px 0 10px;font-size:17px">Recently resolved</h3><table class="t"><tbody>${done.map(tr).join('')}</tbody></table>`:''}`;
}

function viewMaint(){
  const active=Object.entries(S.boats).filter(([,b])=>b.status!=='retired'&&b.ownership!=='private');
  const due=active.map(([id,b])=>({id,b,lm:lastMaint(id)})).filter(x=>daysSince(x.lm&&x.lm.date)>MAINT_DUE_DAYS).sort((a,b)=>(a.lm?.date||'').localeCompare(b.lm?.date||''));
  const logs=Object.entries(S.maint).sort((a,b)=>String(b[1].date).localeCompare(String(a[1].date))).slice(0,80);
  return `<div class="page-h"><div><h2>Maintenance</h2><p>Each club boat is assigned to a program for its maintenance cycle. Boats with nothing logged in the last ${MAINT_DUE_DAYS} days are shown as due.</p></div>${canMember()?`<button class="btn pri" id="logAny">Log maintenance</button>`:''}</div>
  <h3 style="margin:0 0 10px;font-size:17px">Due for maintenance <span class="muted" style="font-family:Inter;font-size:12px">${due.length}</span></h3>
  ${due.length?`<table class="t"><thead><tr><th>Boat</th><th>Rig</th><th>Assigned program</th><th>Last done</th></tr></thead><tbody>${due.map(x=>`<tr class="row" data-boat="${esc(x.id)}"><td class="name">${esc(x.b.name)}</td><td>${rigChips(x.b)}</td><td>${esc(x.b.maintenanceProgram||'Unassigned')}</td><td>${x.lm?fmtDate(x.lm.date):'<span class="muted">never logged</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="banner">Every club boat has been maintained recently.</div>'}
  <h3 style="margin:26px 0 10px;font-size:17px">Maintenance log</h3>
  ${logs.length?`<table class="t"><thead><tr><th>Date</th><th>Boat</th><th class="hide-s">Program</th><th class="hide-s">Crew</th><th>Notes</th></tr></thead><tbody>${logs.map(([,l])=>`<tr class="row" data-boat="${esc(l.boatId)}"><td style="white-space:nowrap">${fmtDate(l.date)}</td><td class="name">${esc(S.boats[l.boatId]?.name||'—')}</td><td class="hide-s">${esc(l.program||'')}</td><td class="hide-s">${esc(l.crew||'')}</td><td>${esc(l.notes||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="banner">Nothing logged yet.</div>'}`;
}

function bindMain(){
  document.querySelectorAll('[data-boat]').forEach(el=>el.onclick=()=>openBoat(el.dataset.boat));
  document.querySelectorAll('[data-stat]').forEach(el=>el.onclick=()=>{S.status=el.dataset.stat;render()});
  document.querySelectorAll('[data-cls]').forEach(el=>el.onclick=()=>{S.cls=el.dataset.cls;render()});
  document.querySelectorAll('[data-layout]').forEach(el=>el.onclick=()=>{S.layout=el.dataset.layout;try{localStorage.setItem('fleetLayout',S.layout)}catch(e){};render()});
  const q=$('#q');if(q){q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
  const fs=$('#fStatus');if(fs)fs.onchange=()=>{S.status=fs.value;render()};
  const fp=$('#fProg');if(fp)fp.onchange=()=>{S.prog=fp.value;render()};
  const ab=$('#addBoat');if(ab)ab.onclick=()=>boatForm(null);
  const ra=$('#reportAny');if(ra)ra.onclick=()=>issueForm(null);
  const la=$('#logAny');if(la)la.onclick=()=>maintForm(null);
}

/* ---------- drawer ---------- */
function openBoat(id){S.openM=null;S.open=id;renderDrawer();$('#drawer').classList.add('on');$('#scrim').classList.add('on');$('#drawer').setAttribute('aria-hidden','false')}
function closeBoat(){S.open=null;S.openM=null;$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true')}
$('#scrim').onclick=closeBoat;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else closeBoat()}});

function renderDrawer(){
  const id=S.open,b=S.boats[id],d=$('#drawer');
  if(!b){d.innerHTML=`<div class="dh"><button class="x" id="dx">×</button><h2>Boat removed</h2></div>`;$('#dx').onclick=closeBoat;return}
  const oi=boatOpenIssues(id);
  const issues=Object.entries(S.issues).filter(([,i])=>i.boatId===id).sort((a,c)=>String(c[1].at).localeCompare(String(a[1].at)));
  const logs=Object.values(S.maint).filter(m=>m.boatId===id).sort((a,c)=>String(c.date).localeCompare(String(a.date)));
  const evs=Object.values(S.events).filter(e=>e.boatId===id).sort((a,c)=>String(c.at).localeCompare(String(a.at))).slice(0,30);
  const unsafe=oi.some(([,i])=>i.severity==='unsafe');
  d.innerHTML=`
  <div class="dh"><button class="x" id="dx" aria-label="Close">×</button>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">${pill(b.status)}${b.ownership==='private'?'<span class="tag">Privately owned</span>':''}</div>
    <h2>${esc(b.name)}</h2>
    <div style="margin-top:8px;display:flex;gap:5px">${rigChips(b)}</div>
  </div>
  <div class="db">
    ${unsafe&&b.status==='available'?`<div class="callout bad">A member has reported this boat as <b>unsafe</b>. ${canAdmin()?'Review the issue below and set the status to Do Not Row if needed.':'Please choose another boat until an admin reviews it.'}</div>`:''}
    ${b.status!=='available'&&b.statusNote?`<div class="callout">${esc(b.statusNote)}</div>`:''}

function openModal(html,bind){$('#mbox').innerHTML=html;$('#modal').classList.add('on');bind&&bind();const f=$('#mbox input,#mbox select,#mbox textarea');f&&f.focus()}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function fld(label,inner,cls='',hint=''){return `<div class="fld ${cls}"><label>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function boatOptions(sel){return Object.entries(S.boats).filter(([,b])=>b.status!=='retired').sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([id,b])=>`<option value="${esc(id)}" ${id===sel?'selected':''}>${esc(b.name)} (${esc(b.currentRig)})</option>`).join('')}
function formFoot(label,danger){return `<div class="err" id="ferr"></div><div class="mfoot"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn ${danger?'dan solid':'pri'}" type="submit" id="mSave">${label}</button></div>`}
function wireForm(onSubmit){
  $('#mCancel').onclick=closeModal;
  $('#mform').onsubmit=async e=>{e.preventDefault();const btn=$('#mSave');const err=$('#ferr');err.textContent='';
    const fd=Object.fromEntries(new FormData($('#mform')).entries());fd._c={};$('#mform').querySelectorAll('input[type=checkbox]').forEach(x=>{(fd._c[x.name]=fd._c[x.name]||[]);if(x.checked)fd._c[x.name].push(x.value)});fd._rigs=fd._c.rig||[];
    const v=onSubmit.validate?onSubmit.validate(fd):null;if(v){err.textContent=v;return}
    btn.disabled=true;const ok=await guarded(()=>onSubmit.save(fd),onSubmit.msg);btn.disabled=false;if(ok){closeModal();if(onSubmit.after)onSubmit.after()}}
}

function slugify(s){return (s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'boat').slice(0,60)}

function boatForm(id){

    ${fld('Manufacturer',`<input name="manufacturer" value="${esc(b.manufacturer||'')}" placeholder="e.g. Empacher, Hudson">`)}
    ${fld('Year built',`<input name="year" type="number" min="1950" max="2100" value="${esc(b.year||'')}">`)}
    ${fld('Serial / hull #',`<input name="serial" value="${esc(b.serial||'')}">`)}
    ${fld('Notes',`<textarea name="notes">${esc(b.notes||'')}</textarea>`,'full')}
  </div>${formFoot(id?'Save changes':'Add boat')}</form>`,()=>{
    const sync=()=>{const sel=$('#curRig');const r=[...document.querySelectorAll('#mform input[name=rig]:checked')].map(x=>x.value);const cur=sel.value||b.currentRig;sel.innerHTML=r.length?r.map(x=>`<option ${x===cur?'selected':''}>${x}</option>`).join(''):'<option value="">Pick rigs first</option>'};
    document.querySelectorAll('#mform input[name=rig]').forEach(x=>x.onchange=sync);sync();
    wireForm({
      validate:fd=>{if(!fd.name.trim())return'Give the boat a name.';if(!fd._rigs.length)return'Pick at least one rig.';
        const seats=new Set(fd._rigs.map(r=>r[0]));if(seats.size>1)return'All rigging options must have the same number of seats.';
        if(fd.lbsMin&&fd.lbsMax&&+fd.lbsMin>+fd.lbsMax)return'Min weight is above max.';
        if(!id&&Object.values(S.boats).some(x=>x.name.trim().toLowerCase()===fd.name.trim().toLowerCase()))return'A boat with that name already exists.';return null},
      msg:id?'Boat updated':'Boat added',
      save:async fd=>{
        const lmin=fd.lbsMin?+fd.lbsMin:null,lmax=fd.lbsMax?+fd.lbsMax:null;
        const weight=lmax?{lbsMax:lmax,kgMax:Math.round(lmax/2.2046),...(lmin?{lbsMin:lmin,kgMin:Math.round(lmin/2.2046)}:{})}:null;
        const data={name:fd.name.trim(),rigs:fd._rigs,currentRig:fd.currentRig||fd._rigs[0],seats:+fd._rigs[0][0],ownership:fd.ownership,weight,
          maintenanceProgram:fd.maintenanceProgram,manufacturer:fd.manufacturer.trim(),year:fd.year?+fd.year:null,serial:fd.serial.trim(),notes:fd.notes.trim(),updatedAt:nowIso()};
        if(id){
          const changes=[];if(data.name!==b.name)changes.push(`renamed from “${b.name}”`);if(data.currentRig!==b.currentRig)changes.push(`re-rigged ${b.currentRig} → ${data.currentRig}`);

          await logEvent(nid,'created','Added to the fleet');
        }
      }});
  });
}

const M_PROGRAMS=['Juniors','Novice','Intermediate','Rec','Masters','Para'];
const SIDES=['Port','Starboard','Sculling','Cox'];
const EXPERIENCE=['Learn to Row','Novice','Intermediate','Experienced','Competitive'];
const ROLES={rower:'Rower',coach:'Coach',cox:'Cox'};
const M_STATUS={active:'Active',review:'Needs details',inactive:'Inactive'};
Object.assign(S,{members:{},activity:{},crews:{},claims:{},mpriv:{},mprefs:{},openM:null,mq:'',mprog:'all',mstatus:'current',mlayout:'grid',claimQ:''});
Object.assign(S.loaded,{members:false,activity:false,crews:false});

const mKey=id=>{const m=S.members[id];return (m&&m.linkedUser)||id};
const myMemberId=()=>{if(!S.me)return null;for(const [id,m] of Object.entries(S.members))if(m.linkedUser===S.me)return id;return null};
const canSeePrivate=id=>canAdmin()||(!!S.me&&!!S.members[id]&&S.members[id].linkedUser===S.me);
function mName(id){const m=S.members[id];return m?(m.displayName||'Member'):'(removed member)'}
function initials(n){return (n||'?').replace(/[^\p{L}\s-]/gu,'').split(/[\s-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?'}
function avatar(id,size=40){const ph=prefsOf(id).photo;return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px">${esc(initials(mName(id)))}${ph?`<img class="avph" src="${esc(blobUrl(ph))}" alt="" loading="lazy">`:''}</span>`}
function memberActs(id){return allActs().filter(a=>a.memberId===id).map(a=>[a.bookingId||'',a]).sort((a,b)=>String(b[1].date).localeCompare(String(a[1].date)))}
function memberStats(id){
  const acts=memberActs(id).map(x=>x[1]);const t=today();
  const past=acts.filter(a=>a.date<=t),up=acts.filter(a=>a.date>t).reverse();
  const boats={};past.forEach(a=>{if(a.boatId)boats[a.boatId]=(boats[a.boatId]||0)+1});
  return {past,up,topBoats:Object.entries(boats).sort((a,b)=>b[1]-a[1]),last:past[0]||null,d30:past.filter(a=>daysSince(a.date)<=30).length};
}
function memberCrews(id){return Object.entries(S.crews).filter(([,c])=>(c.memberIds||[]).includes(id))}
function prefsOf(id){return S.mprefs[mKey(id)]||{}}
function privOf(id){return S.mpriv[mKey(id)]||null}
function dispName(first,last){first=(first||'').trim();last=(last||'').trim();return first+(last?' '+last[0].toUpperCase():'')}
function tile(v,l,small){return `<div class="tile"><div class="v ${small?'sm':''}">${v}</div><div class="l">${l}</div></div>`}
function checks(name,opts,sel){sel=sel||[];return `<div class="rigpick">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<label><input type="checkbox" name="${name}" value="${esc(v)}" ${sel.includes(v)?'checked':''}>${esc(l)}</label>`}).join('')}</div>`}
const SEARCH_ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

/* ---------- directory ---------- */
function viewMembers(){
  const all=Object.entries(S.members);const t=today();
  const pend=Object.entries(S.claims).filter(([,c])=>c.status!=='rejected');
  const stats=[['current','Members',all.filter(([,m])=>m.status!=='inactive').length,'var(--navy)',1],
    ['linked','Accounts linked',all.filter(([,m])=>m.linkedUser).length,'var(--ok)',1],
    ...(canAdmin()?[['review','Needs details',all.filter(([,m])=>m.status==='review').length,'var(--warn)',1]]:[]),
    ['x1','Sessions logged',allActs().filter(a=>a.date<t).length,'var(--red)',0],
    ['x2','Upcoming bookings',allActs().filter(a=>a.date>=t).length,'#6b5ca5',0]];
  const q=S.mq.trim().toLowerCase();
  const list=all.filter(([id,m])=>{
    if(S.mstatus==='current'&&m.status==='inactive')return false;
    if(S.mstatus==='linked'&&!m.linkedUser)return false;
    if(S.mstatus==='admins'&&!m.siteAdmin)return false;
    if(['review','active','inactive'].includes(S.mstatus)&&m.status!==S.mstatus)return false;
    if(S.mprog!=='all'&&!(m.programs||[]).includes(S.mprog))return false;
    if(q&&!(`${m.displayName} ${m.firstName||''} ${m.lastName||''} ${(m.programs||[]).join(' ')}`.toLowerCase().includes(q)))return false;
    return true}).sort((a,b)=>a[1].displayName.localeCompare(b[1].displayName));
  const claimsHtml=canAdmin()&&pend.length?`<div class="sec claims"><h4>Profile requests · ${pend.length} waiting</h4>${pend.map(([uid,c])=>`<div class="item claim"><div><b>${esc((S.profiles[uid]&&S.profiles[uid].name)||'A member')}</b> <span class="muted">(sign-in account)</span> ${c.type==='existing'?`says they are <span class="lnk" data-member="${esc(c.memberId)}">${esc(mName(c.memberId))}</span>`:`is new: <b>${esc(((c.firstName||'')+' '+(c.lastName||'')).trim())}</b> · ${esc((c.programs||[]).join(', ')||'no program')}`}${c.note?`<div class="muted" style="margin-top:3px">“${esc(c.note)}”</div>`:''}<div class="when">${fmtDate(c.at)}</div></div><div class="actions" style="margin:0;flex:none"><button class="btn sm pri" data-approve="${esc(uid)}">Approve</button><button class="btn sm" data-reject="${esc(uid)}">Decline</button></div></div>`).join('')}</div>`:'';
  const progs=progNames().filter(p=>all.some(([,m])=>(m.programs||[]).includes(p)));
  let body;
  if(!all.length)body=`<div class="banner"><h3>No members yet</h3>${canAdmin()?'Add the first member with the button above.':'An admin needs to add the member list.'}</div>`;
  else if(!list.length)body=`<div class="banner">No members match these filters.</div>`;

/* =================== PROGRAMS MODULE =================== */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_L=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const CREW_MIX=['100% Program Rowers','75% Program Rowers','50% Program Rowers','Designated Crew'];
const PCOLORS=['#ea3c42','#2b6cb0','#2c7a57','#a86b12','#6b5ca5','#0f766e','#c2410c','#86888b'];
Object.assign(S,{programs:{},sessions:{},bookings:{},occ:{},week:null,sess:null,pscope:null});
Object.assign(S.loaded,{programs:false,sessions:false,bookings:false});

const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mondayOf=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
function fmtTime(t){if(!t)return'';const [h,m]=t.split(':').map(Number);return `${((h+11)%12)+1}${m?':'+pad(m):''} ${h>=12?'pm':'am'}`}
function timeRange(s){return s.start?`${fmtTime(s.start)}${s.end?' – '+fmtTime(s.end):''}`:'Time TBC'}
function dayLabel(d,long){return pd(d).toLocaleDateString(undefined,long?{weekday:'long',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'})}
const progNames=()=>{const n=Object.values(S.programs).filter(p=>p.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>p.name);return n.length?n:M_PROGRAMS};
const occKey=(sid,d)=>sid+'_'+d.replace(/-/g,'');
const occ=(sid,d)=>S.occ[occKey(sid,d)]||{};
const progOf=sid=>{const s=S.sessions[sid];return (s&&S.programs[s.programId])||{}};
const eligNames=sid=>{const s=S.sessions[sid];return s&&s.eligible&&s.eligible.length?s.eligible:[progOf(sid).name]};
const eligible=(mid,sid)=>{const m=S.members[mid];return !!m&&(m.programs||[]).some(p=>eligNames(sid).includes(p))};
const capacity=(sid,d)=>occ(sid,d).capacity||(S.sessions[sid]||{}).capacity||0;
const coachOf=(sid,d)=>occ(sid,d).coach||(S.sessions[sid]||{}).coach||'';
const safetyOf=(sid,d)=>occ(sid,d).safety||(S.sessions[sid]||{}).safety||'';
function sessBookings(sid,d){return Object.entries(S.bookings).filter(([,b])=>b.sessionId===sid&&b.date===d&&bMembers(b).length).sort((a,b)=>(a[1].erg||0)-(b[1].erg||0)||String(a[1].at).localeCompare(String(b[1].at)))}
function nextErg(sid,d){const used=new Set(sessBookings(sid,d).map(([,b])=>b.erg));for(let i=1;i<=(capacity(sid,d)||99);i++)if(!used.has(i))return i;return null}
const bMembers=b=>[...(b.crew||[]),b.cox].filter(Boolean);
function windowState(sid,d){
  const s=S.sessions[sid],p=progOf(sid);const days=p.opensDays==null?6:+p.opensDays;
  const now=new Date();const openAt=pd(addDays(d,-days));openAt.setHours(0,0,0,0);
  const st=pd(d);if(s&&s.start){const [h,m]=s.start.split(':').map(Number);st.setHours(h,m,0,0)}else st.setHours(23,59,0,0);
  if(now<openAt)return {state:'soon',at:ds(openAt)};if(now>st)return {state:'closed'};return {state:'open'};
}
function myBookingIn(sid,d){const me=myMemberId();if(!me)return null;return sessBookings(sid,d).find(([,b])=>bMembers(b).includes(me))||null}
function goSession(sid,d){closeBoat();location.hash='s-'+sid+'-'+d.replace(/-/g,'')}
function seatsFor(rig){const n=parseInt(rig,10)||1;return {rowers:n,cox:/\+/.test(rig)}}

/* person-session records from imported history + bookings (used by member stats & boat crews) */
function allActs(){
  const out=[];for(const a of Object.values(S.activity))out.push(a);
  for(const [bid,b] of Object.entries(S.bookings)){if(!bMembers(b).length)continue;const s=S.sessions[b.sessionId]||{};
    for(const mid of bMembers(b))out.push({memberId:mid,date:b.date,session:s.title||'Session',program:progOf(b.sessionId).name||'',type:s.type==='erg'?'erg':'row',boatId:b.boatId||null,rig:b.rig||'',sessionId:b.sessionId,bookingId:bid})}
  return out;
}

/* ---------- booking actions ---------- */
function memberOpts(sid,d,sel,exclBid){
  const busy=new Set();sessBookings(sid,d).forEach(([bid,b])=>{if(bid!==exclBid)bMembers(b).forEach(x=>busy.add(x))});
  const all=Object.entries(S.members).filter(([,m])=>m.status!=='inactive').sort((a,b)=>a[1].displayName.localeCompare(b[1].displayName));
  const inP=all.filter(([x])=>eligible(x,sid)),out=all.filter(([x])=>!eligible(x,sid));
  const o=([x,m])=>`<option value="${esc(x)}" ${x===sel?'selected':''} ${busy.has(x)&&x!==sel?'disabled':''}>${esc(m.displayName)}${busy.has(x)&&x!==sel?' (already booked)':''}</option>`;
  return `<option value="">— Open seat —</option><optgroup label="${esc(eligNames(sid).join(' / '))}">${inP.map(o).join('')}</optgroup><optgroup label="Other members (guests)">${out.map(o).join('')}</optgroup>`;
}
function bookingForm(sid,d,bid,preBoat){
  const s=S.sessions[sid],p=progOf(sid),b=bid?S.bookings[bid]:null,me=myMemberId();
  const taken=new Set(sessBookings(sid,d).filter(([x])=>x!==bid).map(([,x])=>x.boatId).filter(Boolean));
  const boats=Object.entries(S.boats).filter(([x,o])=>o.status!=='retired'&&!taken.has(x)).sort((a,c)=>(a[1].seats-c[1].seats)||a[1].name.localeCompare(c[1].name));
  const cur=b?b.boatId||'':preBoat||'';
  const boatSel=`<select name="boatId" id="bBoat">${p.boatRequired===false?`<option value="" ${cur===''?'selected':''}>No boat – coach will assign</option>`:'<option value="">Choose a boat…</option>'}${CLASSES.map(c=>{const g=boats.filter(([,o])=>o.seats===c.k);return g.length?`<optgroup label="${c.t}">${g.map(([x,o])=>`<option value="${esc(x)}" ${x===cur?'selected':''} ${o.status!=='available'&&!canAdmin()?'disabled':''}>${esc(o.name)} · ${esc((o.rigs||[]).join('/'))}${o.weight&&o.weight.lbsMax?' · '+esc(wtText(o.weight).split(' · ')[0]):''}${o.status!=='available'?' · '+esc(STATUS[o.status]):''}</option>`).join('')}</optgroup>`:''}).join('')}</select>`;
  openModal(`<h3>${b?'Edit booking':'Book a boat'}</h3><p class="muted" style="margin-top:-6px">${esc(s.title)} · ${dayLabel(d,true)} · ${esc(timeRange(s))}</p><form id="mform"><div class="fg">
    ${fld('Boat',boatSel,'full')}
    ${fld('Rig',`<select name="rig" id="bRig"></select>`,'',`<span id="rigHint"></span>`)}
    ${fld('Crew mix',`<select name="crewMix">${CREW_MIX.map(x=>`<option ${(b?b.crewMix:CREW_MIX[0])===x?'selected':''}>${x}</option>`).join('')}</select>`)}
    <div class="full"><label class="fl">Crew <span class="tag">· seat 1 is bow</span></label><div class="seatgrid" id="seats"></div></div>
    ${fld('Notes',`<input name="notes" value="${esc(b?b.notes||'':'')}" placeholder="e.g. Looking for a stroke seat">`,'full')}
    <div class="full" style="display:flex;gap:18px;flex-wrap:wrap">
      <label class="tog"><input type="checkbox" name="open" value="1" ${!b||b.open?'checked':''}> Others can join open seats</label>
      ${p.pcocAllowed===false?'':`<label class="tog"><input type="checkbox" name="pcoc" value="1" ${b&&b.pcoc?'checked':''}> Rowing under PCOC</label>`}
    </div>
  </div>${formFoot(b?'Save booking':'Book')}</form>`,()=>{
    const boatEl=$('#bBoat'),rigEl=$('#bRig'),seatsEl=$('#seats');let saved=null;
    const meBusy=!!me&&sessBookings(sid,d).some(([x,o])=>x!==bid&&bMembers(o).includes(me));
    let crew=b?[...(b.crew||[])]:[meBusy?'':(me||'')],cox=b?b.cox||'':'';
    const readSeats=()=>{crew=[...seatsEl.querySelectorAll('select[data-seat]')].map(x=>x.value);const c=seatsEl.querySelector('select[data-cox]');cox=c?c.value:cox};
    const drawSeats=()=>{const rig=rigEl.value||'1x';const {rowers,cox:hasCox}=seatsFor(boatEl.value?rig:'1x');
      seatsEl.innerHTML=Array.from({length:rowers},(_,i)=>`<div class="fld"><label>${rowers===1?'Sculler':i===0?'Bow (1)':i===rowers-1?`Stroke (${i+1})`:`Seat ${i+1}`}</label><select data-seat="${i}">${memberOpts(sid,d,crew[i]||'',bid)}</select></div>`).join('')+(hasCox?`<div class="fld"><label>Cox</label><select data-cox="1">${memberOpts(sid,d,cox,bid)}</select></div>`:'');
      seatsEl.querySelectorAll('select').forEach(x=>x.onchange=readSeats)};
    const drawRig=()=>{const o=S.boats[boatEl.value];const keep=rigEl.value||(b&&b.boatId===boatEl.value?b.rig:'');
      rigEl.innerHTML=o?(o.rigs||[]).map(r=>`<option ${r===(keep||o.currentRig)?'selected':''}>${esc(r)}</option>`).join(''):'<option value="">—</option>';rigEl.disabled=!o;hint()};
    const hint=()=>{const o=S.boats[boatEl.value];$('#rigHint').innerHTML=o&&rigEl.value&&rigEl.value!==o.currentRig?`<span class="rerig">Re-rig needed · currently ${esc(o.currentRig)}</span>`:o?'Matches current rig':''};
    boatEl.onchange=()=>{readSeats();drawRig();drawSeats()};rigEl.onchange=()=>{readSeats();hint();drawSeats()};
    drawRig();drawSeats();
    wireForm({msg:b?'Booking updated':'Booked – see you on the water',
      validate:fd=>{readSeats();
        if(p.boatRequired!==false&&!fd.boatId)return'Choose a boat.';
        const rig=fd.boatId?fd.rig:'1x';const {rowers,cox:hasCox}=seatsFor(rig);
        const cr=crew.slice(0,rowers).map(x=>x||null);while(cr.length<rowers)cr.push(null);const cx=hasCox?(cox||null):null;
        const ms=[...cr,cx].filter(Boolean);if(!ms.length)return'Add at least one person to the crew.';
        if(new Set(ms).size!==ms.length)return'Someone is in two seats.';
        if(!canAdmin()&&me&&!ms.includes(me))return'Include yourself in the crew (admins can book for others).';
        const busy=new Set();sessBookings(sid,d).forEach(([x,o])=>{if(x!==bid)bMembers(o).forEach(y=>busy.add(y))});
        const clash=ms.find(x=>busy.has(x));if(clash)return`${mName(clash)} is already in another boat this session.`;
        if(fd.boatId&&sessBookings(sid,d).some(([x,o])=>x!==bid&&o.boatId===fd.boatId))return'That boat was just booked by someone else.';
        if(!bid&&!canAdmin()&&capacity(sid,d)&&sessBookings(sid,d).length>=capacity(sid,d))return'This session is full.';
        if(!canAdmin()&&windowState(sid,d).state!=='open')return'Sign-ups aren’t open for this session.';
        fd._crew=cr;fd._cox=cx;return null},
      save:async fd=>{
        const data={sessionId:sid,date:d,boatId:fd.boatId||null,rig:fd.boatId?fd.rig:'',crew:fd._crew,cox:fd._cox,crewMix:fd.crewMix,notes:fd.notes.trim(),
          open:!!(fd._c.open||[]).length&&fd._crew.some(x=>!x),pcoc:!!(fd._c.pcoc||[]).length,
          captain:b?b.captain||null:(me||fd._crew.find(Boolean)||null),createdBy:b?b.createdBy||null:(S.me||null),at:b?b.at:nowIso(),updatedAt:nowIso()};
        const ref=bid?S.db.doc('bookings/'+bid):S.db.collection('bookings').doc();await ref.set(data);saved={id:ref.id,data};
      },after:()=>{if(saved&&!bid)maybeCalendar(saved.id,saved.data)}});
  });
}
async function ergSignup(sid,d,mid){
  if(!mid)return;
  const s=S.sessions[sid];const bk=sessBookings(sid,d);
  if(!canAdmin()&&capacity(sid,d)&&bk.length>=capacity(sid,d))return toast('This session is full');
  if(bk.some(([,b])=>bMembers(b).includes(mid)))return toast(`${mName(mid)} is already signed up`);
  const data={sessionId:sid,date:d,boatId:null,rig:'',crew:[mid],cox:null,open:false,notes:'',erg:nextErg(sid,d),captain:mid,createdBy:S.me||null,at:nowIso()};let ref=null;
  const ok=await guarded(async()=>{ref=await S.db.collection('bookings').add(data)},mid===myMemberId()&&prefsOf(mid).calPrompt===false?'You’re signed up':(mid===myMemberId()?'':'Added'));
  if(ok&&ref&&mid===myMemberId())maybeCalendar(ref.id,data);
}

function cancelBooking(bid){

async function leaveBooking(bid){
  const b=S.bookings[bid],me=myMemberId();if(!b||!me)return;

async function joinBooking(bid){

}

const CLUB_TZ='America/Vancouver';
const CLUB_LOC='Vancouver Rowing Club, Stanley Park, Vancouver, BC';
const PORTAL_URL=location.origin+location.pathname;
function tzOffsetMin(dt){
  // BC moved to permanent UTC-7 (Pacific Time) after the final clock change on 8 Mar 2026; don't rely on device tz data being current
  if(dt.getTime()>=Date.UTC(2026,2,8,10))return -420;
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:CLUB_TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(dt).map(x=>[x.type,x.value]));
  return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-dt.getTime())/60000;
}
function clubInstant(d,t){const [y,m,dd]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);const g=Date.UTC(y,m-1,dd,h,mi);return new Date(g-tzOffsetMin(new Date(g))*60000)}
const icsUtc=dt=>dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function icsFold(line){const out=[];let s=line;while(new TextEncoder().encode(s).length>73){let n=73;while(new TextEncoder().encode(s.slice(0,n)).length>73)n--;out.push(s.slice(0,n));s=s.slice(n)}out.push(s);return out.join('\r\n ')}
function myEmail(){const me=myMemberId();const p=me&&privOf(me);return (p&&p.email)||''}
function calProvider(email){const dom=(email.split('@')[1]||'').toLowerCase();
  if(/^(gmail|googlemail)\.com$/.test(dom))return 'google';
  if(/^(outlook|hotmail|live|msn)\./.test(dom))return 'outlook';
  if(/^(icloud|me|mac)\.com$/.test(dom))return 'apple';
  return email?'other':'';}
function eventFor(bid,b){
  const s=S.sessions[b.sessionId]||{},boat=S.boats[b.boatId],p=progOf(b.sessionId);
  const what=boat?`${b.rig||boat.currentRig} ${boat.name}`:(s.type==='erg'?(b.erg?`Erg ${b.erg}`:'Erg'):'');
  const title=`${s.title||'Rowing session'}${what?' · '+what:''}`;
  const crew=bMembers(b).map(mName);
  const link=`${PORTAL_URL}#s-${b.sessionId}-${b.date.replace(/-/g,'')}`;
  const details=[`${p.name||'Club'} session at Vancouver Rowing Club.`,coachOf(b.sessionId,b.date)?`Coach: ${coachOf(b.sessionId,b.date)}`:'',boat?`Boat: ${what}`:'',s.type==='erg'&&b.erg?`Erg: ${b.erg}`:'',crew.length>1?`Crew: ${crew.join(', ')}${b.cox?' (cox '+mName(b.cox)+')':''}`:'',b.notes?`Notes: ${b.notes}`:'',`Sign-out sheet: ${link}`].filter(Boolean).join('\n');
  let start=null,end=null,allDay=!s.start;
  if(!allDay){start=clubInstant(b.date,s.start);end=s.end?clubInstant(b.date,s.end):new Date(start.getTime()+90*60000)}
  return {uid:`${bid}@vrc-rowing-portal`,title,details,start,end,allDay,date:b.date,link,seq:Math.floor(Date.parse(b.updatedAt||b.at||nowIso())/1000)||0};
}
function icsFor(evs,cancel){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VRC Rowing Portal//EN','CALSCALE:GREGORIAN',`METHOD:${cancel?'CANCEL':'PUBLISH'}`,'X-WR-CALNAME:VRC Rowing'];
  for(const e of evs){
    L.push('BEGIN:VEVENT',`UID:${e.uid}`,`DTSTAMP:${icsUtc(new Date())}`,`SEQUENCE:${e.seq+(cancel?1:0)}`);
    if(e.allDay){L.push(`DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(e.date,1).replace(/-/g,'')}`)}
    else L.push(`DTSTART:${icsUtc(e.start)}`,`DTEND:${icsUtc(e.end)}`);
    L.push(`SUMMARY:${icsEsc((cancel?'Cancelled: ':'')+e.title)}`,`DESCRIPTION:${icsEsc(e.details)}`,`LOCATION:${icsEsc(CLUB_LOC)}`,`URL:${e.link}`,`STATUS:${cancel?'CANCELLED':'CONFIRMED'}`);
    if(!cancel&&!e.allDay)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Rowing session in 1 hour','TRIGGER:-PT60M','END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n';
}
function googleUrl(e){const dates=e.allDay?`${e.date.replace(/-/g,'')}/${addDays(e.date,1).replace(/-/g,'')}`:`${icsUtc(e.start)}/${icsUtc(e.end)}`;
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:e.title,dates,details:e.details,location:CLUB_LOC,ctz:CLUB_TZ}).toString()}
function outlookUrl(e,work){const q={path:'/calendar/action/compose',rru:'addevent',subject:e.title,body:e.details,location:CLUB_LOC};
  if(e.allDay){q.startdt=e.date;q.enddt=addDays(e.date,1);q.allday='true'}else{q.startdt=e.start.toISOString();q.enddt=e.end.toISOString()}
  return `https://outlook.${work?'office':'live'}.com/calendar/0/deeplink/compose?`+new URLSearchParams(q).toString()}
async function saveIcs(evs,filename,cancel){
  const dl=await claude.use('downloads');
  if(!dl){toast('Calendar files can’t be downloaded in this view – use the Google or Outlook option');return false}
  try{await dl.save({filename,data:new Blob([icsFor(evs,cancel)],{type:'text/calendar'})});return true}
  catch(e){toast('Calendar file wasn’t saved');return false}
}

/* =================== ISSUE PHOTOS =================== */
let ASSETS;
async function assetsNs(){if(ASSETS===undefined){try{ASSETS=await claude.use('assets')}catch(e){ASSETS=null}}return ASSETS}
const MAX_PHOTOS=4;
async function shrinkPhoto(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(b)return b}catch(e){}
  if(/^image\/(png|jpeg|gif|webp)$/.test(file.type))return file;
  throw {code:'photo',message:'That photo format isn’t supported – try a JPEG or PNG.'};
}
async function uploadPhotos(files){
  const a=await assetsNs();if(!a)throw {code:'photo',message:'Photo uploads aren’t available for your account.'};
  const ids=[];
  for(const f of files){const blob=await shrinkPhoto(f);
    try{const r=await a.upload(blob,{type:blob.type||'image/jpeg'});ids.push(r.id)}
    catch(e){throw {code:'photo',message:e&&e.code==='quota_or_state'?'Photo storage is full – ask an admin.':e&&e.code==='too_large'?'That photo is too large.':'A photo couldn’t be uploaded – please try again.'}}}
  return ids;
}
function photoStrip(ids){return ids&&ids.length?`<div class="thumbs">${ids.map(id=>`<img src="${esc(blobUrl(id))}" data-photo="${esc(id)}" loading="lazy" alt="Damage photo">`).join('')}</div>`:''}
/* picker inside a form: returns getter for selected files */
function photoPicker(root){
  const files=[];const list=root.querySelector('.phlist'),inp=root.querySelector('input[type=file]'),add=root.querySelector('.phadd');
  const draw=()=>{list.innerHTML=files.map((f,i)=>`<span class="ph"><img src="${f.url}" alt=""><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></span>`).join('');
    list.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{URL.revokeObjectURL(files[+b.dataset.rm].url);files.splice(+b.dataset.rm,1);draw()});
    add.style.display=files.length>=MAX_PHOTOS?'none':''};
  inp.onchange=()=>{for(const f of inp.files){if(files.length>=MAX_PHOTOS)break;if(/^image\//.test(f.type)||/\.(heic|heif)$/i.test(f.name))files.push({file:f,url:URL.createObjectURL(f)})}inp.value='';draw()};
  draw();return ()=>files.map(f=>f.file);
}
function photoField(){return `<div class="fld full" id="phField"><label>Photos <span class="tag">· optional, up to ${MAX_PHOTOS}</span></label><div class="phrow"><div class="phlist"></div><label class="btn sm phadd"><input type="file" accept="image/*" multiple hidden>📷 Take or add photo</label></div><div class="hint" id="phHint">On a phone you can take a photo straight from the camera.</div></div>`}
async function enablePhotoField(){const root=$('#phField');if(!root)return null;const a=await assetsNs();
  if(!a){root.querySelector('.phrow').style.display='none';$('#phHint').textContent='Photo uploads aren’t available for your account yet – please post photos in the maintenance channel.';return null}
  return photoPicker(root);}
function addPhotosToIssue(iid){
  const i=S.issues[iid];if(!i)return;

document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img[data-photo]');if(im){e.preventDefault();e.stopPropagation();lightbox(im.src)}},true);

/* =================== PROFILE PHOTOS =================== */
async function squarePhoto(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw {code:'photo',message:'That photo format isn’t supported – try a JPEG or PNG.'}}
  const side=Math.min(bmp.width,bmp.height),out=Math.min(400,side),c=document.createElement('canvas');c.width=c.height=out;
  c.getContext('2d').drawImage(bmp,(bmp.width-side)/2,(bmp.height-side)/2,side,side,0,0,out,out);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!b)throw {code:'photo',message:'Couldn’t process that photo.'};return b;
}
function avatarField(id){const ph=prefsOf(id).photo;
  return `<div class="fld full" id="avField"><label>Profile photo</label><div class="avrow"><span id="avPrev">${avatar(id,64)}</span><label class="btn sm" id="avPick"><input type="file" accept="image/*" hidden id="avIn">📷 ${ph?'Change photo':'Add a photo'}</label>${ph?'<button type="button" class="btn sm dan" id="avRm">Remove</button>':''}</div><div class="hint" id="avHint">Cropped to a square and shown to club members next to your name.</div></div>`}
async function wireAvatarField(id){
  const st={file:null,removed:false};const a=await assetsNs();if(!$('#avField'))return st;
  if(!a){$('#avPick').style.display='none';const r=$('#avRm');if(r)r.style.display='none';$('#avHint').textContent='Photo uploads aren’t available for this account yet.';return st}

  $('#avIn').onchange=()=>{const f=$('#avIn').files[0];if(!f)return;st.file=f;st.removed=false;$('#avPrev').innerHTML=`<span class="av" style="width:64px;height:64px"><img class="avph" src="${URL.createObjectURL(f)}" alt=""></span>`};
  const r=$('#avRm');if(r)r.onclick=()=>{st.file=null;st.removed=true;$('#avPrev').innerHTML=blank();r.style.display='none'};
  return st;
}
async function savePhoto(st,old){
  if(st.file){const a=await assetsNs();const blob=await squarePhoto(st.file);let id;
    try{id=(await a.upload(blob,{type:'image/jpeg'})).id}catch(e){throw {code:'photo',message:e&&e.code==='quota_or_state'?'Photo storage is full – ask an admin.':'Your photo couldn’t be uploaded – please try again.'}}
    if(old)a.delete(old).catch(()=>{});return id}
  if(st.removed){if(old){const a=await assetsNs();if(a)a.delete(old).catch(()=>{})}return null}
  return undefined;
}
