   ${!ownerLinked&&ownerUid()?`<div class="item claim"><div><b>${esc((S.settings.settings||{}).ownerName||'Portal owner')}</b> <span class="tag">· owner${S.me===ownerUid()?' (you)':''}</span><div class="tag">Owner account – link it to a member profile under My profile.</div></div></div>`:''}
   ${list.map(([id,m])=>{const own=m.linkedUser===ownerUid();return `<div class="item claim"><div style="display:flex;gap:10px;align-items:center">${avatar(id,32)}<div><span class="lnk" data-member="${esc(id)}">${esc(m.displayName)}</span>${own?' <span class="tag">· owner</span>':''}${S.me&&m.linkedUser===S.me?' <span class="tag">(you)</span>':''}<div class="tag">${adminActive(m)?'<span style="color:var(--ok)">✓ Admin</span>':'<span style="color:var(--warn)">Becomes admin when they link their account</span>'}</div></div></div>
   <div class="actions" style="margin:0;flex:none">${own||(S.me&&m.linkedUser===S.me)?'':`<button class="btn sm dan" data-unadmin="${esc(id)}">Remove</button>`}</div></div>`}).join('')}
   <p class="tag" style="margin:10px 0 0">Admins can change boats, members, programs and sessions, approve profile requests and see private details. A new admin’s tools appear the next time they open the portal.</p></div>`;
}
function makeAdminForm(id){
  const pick=!id;const opts=Object.entries(S.members).filter(([,m])=>!m.siteAdmin&&m.status!=='inactive').sort((a,b)=>(!!b[1].linkedUser-!!a[1].linkedUser)||a[1].displayName.localeCompare(b[1].displayName));
  const m=id?S.members[id]:null;
  const note=x=>x?(x.linkedUser?`<div class="tag">Their admin tools appear the next time they open the portal.</div>`:`<div class="callout" style="margin:0">${esc(x.displayName)} hasn’t linked a sign-in account yet. They’ll become an admin as soon as you approve their profile request.</div>`):'';
  openModal(`<h3>${m?'Make '+esc(m.displayName)+' an admin':'Add a club admin'}</h3><p class="muted" style="margin-top:-6px">Admins can edit boats, members, programs and sessions, approve profile requests, and see members’ private details.</p>
   <form id="mform"><div class="fg">
    ${pick?fld('Member',`<select name="mid" id="admPick"><option value="">Choose a member…</option><optgroup label="Account linked">${opts.filter(([,o])=>o.linkedUser).map(([x,o])=>`<option value="${esc(x)}">${esc(o.displayName)}</option>`).join('')}</optgroup><optgroup label="Not linked yet">${opts.filter(([,o])=>!o.linkedUser).map(([x,o])=>`<option value="${esc(x)}">${esc(o.displayName)}</option>`).join('')}</optgroup></select>`,'full'):''}
    <div class="full" id="admNote">${note(m)}</div>
   </div>${formFoot('Make admin')}</form>`,()=>{
    const sel=$('#admPick');if(sel)sel.onchange=()=>{$('#admNote').innerHTML=note(S.members[sel.value])};
    wireForm({msg:'Admin added',validate:fd=>pick&&!fd.mid?'Choose a member.':null,
      save:async fd=>{const mid=id||fd.mid,x=S.members[mid];
        await S.db.doc('members/'+mid).update({siteAdmin:true,adminSince:nowIso(),updatedAt:nowIso()});
        if(x.linkedUser)await S.db.doc('admins/'+x.linkedUser).set({memberId:mid,since:nowIso()});}});
  });
}
function adminHow(id){}
function removeAdminForm(id){
  const m=S.members[id];
  openModal(`<h3>Remove ${esc(m.displayName)} as admin?</h3><p class="muted" style="margin-top:-6px">They keep their member access – booking, reporting and their profile – but lose admin tools the next time they open the portal.</p><form id="mform">${formFoot('Remove admin',true)}</form>`,
    ()=>wireForm({msg:'Admin removed',save:async()=>{if(m.linkedUser&&S.admins[m.linkedUser])await S.db.doc('admins/'+m.linkedUser).delete();await S.db.doc('members/'+id).update({siteAdmin:false,updatedAt:nowIso()})}}));
}
function syncMyAdmin(){
  if(S._adminSynced||!S.loaded.members||!S.me||!S.db||S.guest)return;
  const mid=myMemberId();if(!mid)return;S._adminSynced=true;const m=S.members[mid];
  if(S.isAdmin&&!m.siteAdmin)S.db.doc('members/'+mid).update({siteAdmin:true}).catch(()=>{});
}
function adminNotice(){return ''}

/* =================== IMPORT (one-time move from the claude.ai portal) =================== */
S.imp=null;
const IMPORT_ORDER=['programs','sessions','boats','members','memberPrefs','memberPrivate','crews','activity','occurrences','bookings','issues','maintenance','events'];
function transformExport(x){
  const C=x.collections||{};const uidToMid={};
  for(const [mid,m] of Object.entries(C.members||{}))if(m.linkedUser)uidToMid[m.linkedUser]=mid;
  const out={};
  const copy=(name,fn)=>{out[name]={};for(const [id,v] of Object.entries(C[name]||{})){const r=fn?fn(id,v):[id,v];if(r)out[name][r[0]]=r[1]}};
  for(const n of ['boats','programs','sessions','occurrences','activity','crews'])copy(n);
  const who=v=>({by:null,byMember:v.byMember||uidToMid[v.by]||null});
  copy('maintenance',(id,v)=>[id,{...v,...who(v)}]);
  copy('events',(id,v)=>[id,{...v,...who(v)}]);
  copy('issues',(id,v)=>[id,{...v,...who(v),resolvedBy:null}]);
  copy('bookings',(id,v)=>[id,{...v,createdBy:null}]);
  // Sign-in accounts don't carry over: everyone links their profile again (admins approve).
  copy('members',(id,v)=>[id,{...v,linkedUser:null,linkedAt:null,siteAdmin:false,adminConfirmedAt:null,previouslyLinked:!!v.linkedUser||!!v.previouslyLinked}]);
  copy('memberPrefs',(k,v)=>[uidToMid[k]||k,v]);
  copy('memberPrivate',(k,v)=>[uidToMid[k]||k,v]);
  for(const n of ['memberPrefs','memberPrivate'])for(const k of Object.keys(out[n]))if(!out.members[k])delete out[n][k];
  return out;
}
function viewImport(){
  if(!canAdmin())return `<div class="banner"><h3>Admins only</h3></div>`;
  const d=S.imp;
  return `<div class="page-h"><div><a href="#manage" class="lnk">‹ Back to Manage programs</a><h2>Import club data</h2><p>Bring everything over from the original portal on claude.ai: boats, members, programs, bookings, history and photos. In the original portal, go to <b>Programs → Manage programs → Export all data</b>, then choose that file here.</p></div></div>
  <div class="sec" style="max-width:760px">
    <label class="btn"><input type="file" accept="application/json,.json" hidden id="impFile">Choose export file…</label>
    ${d?`<div style="margin-top:14px"><b>${esc(d.name)}</b> <span class="tag">· exported ${fmtDate(d.raw.exportedAt)}</span>
      <table class="t" style="margin-top:10px"><tbody>${IMPORT_ORDER.map(n=>`<tr><td>${esc(n)}</td><td class="ra">${Object.keys(d.data[n]||{}).length}</td></tr>`).join('')}<tr><td>photos</td><td class="ra">${Object.keys(d.raw.photos||{}).length}</td></tr></tbody></table>
      <div class="callout" style="margin-top:12px">Importing writes these records into this portal. Records with the same ID are replaced, so it’s safe to run again with a newer export. Sign-in accounts don’t carry over: members link their profile again from <b>My profile</b> and you approve them, then re-add admins on the Members page.</div>
      <div class="actions"><button class="btn pri" id="impGo">Import ${Object.values(d.data).reduce((n,o)=>n+Object.keys(o).length,0)} records</button></div>
      <div id="impProg" class="tag" style="margin-top:10px"></div></div>`:''}
  </div>`;
}
function bindImport(){
  const f=$('#impFile');if(f)f.onchange=async()=>{const file=f.files[0];if(!file)return;
    try{const raw=JSON.parse(await file.text());if(!raw.collections)throw 0;S.imp={name:file.name,raw,data:transformExport(raw)};render()}
    catch(e){toast('That doesn’t look like a portal export file')}};
  const g=$('#impGo');if(g)g.onclick=runImport;
}
async function runImport(){
  const d=S.imp;if(!d)return;const btn=$('#impGo');btn.disabled=true;const prog=$('#impProg');
  const say=t=>{if(prog)prog.textContent=t};
  try{
    // 1. photos
    const photoMap={};const ph=Object.entries(d.raw.photos||{});const a=await assetsNs();
    for(let i=0;i<ph.length;i++){say(`Uploading photos ${i+1} of ${ph.length}…`);
      try{const blob=await (await fetch(ph[i][1])).blob();const r=await a.upload(blob,{type:blob.type||'image/jpeg'});photoMap[ph[i][0]]=r.id}catch(e){}}
    for(const v of Object.values(d.data.issues||{}))if(v.photos)v.photos=v.photos.map(x=>photoMap[x]).filter(Boolean);
    for(const v of Object.values(d.data.memberPrefs||{}))if(v.photo)v.photo=photoMap[v.photo]||null;
    // 2. records, a few at a time
    const jobs=[];for(const n of IMPORT_ORDER)for(const [id,v] of Object.entries(d.data[n]||{}))jobs.push([n+'/'+id,v]);
    let done=0;const workers=Array.from({length:8},async()=>{while(jobs.length){const [path,v]=jobs.shift();await S.db.doc(path).set(v);done++;if(done%20===0)say(`Saved ${done} records…`)}});
    await Promise.all(workers);
    say(`Done – ${done} records and ${Object.keys(photoMap).length} photos imported.`);toast('Import complete');
    S.imp=null;setTimeout(()=>{location.hash='members'},1500);
  }catch(e){say('Import stopped: '+((e&&e.message)||'error')+'. You can run it again – it picks up where it left off.');btn.disabled=false}
}

/* ---------- go ---------- */
try{const l=localStorage.getItem('fleetLayout');if(l)S.layout=l;const ml=localStorage.getItem('memberLayout');if(ml)S.mlayout=ml}catch(e){}
route();init();
